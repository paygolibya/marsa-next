name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # No real database is used or needed here — prisma generate only reads
    # the schema file (it doesn't connect), and this app never queries the
    # DB at build time (no generateStaticParams anywhere touches Prisma),
    # so a placeholder URL is enough for typecheck/test/build. This also
    # means CI never needs the real production DATABASE_URL as a secret.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
      JWT_SECRET: "ci-test-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gated on "critical" only, not the default (which would also flag
      # moderate/high) — there's a real, known high-severity issue today
      # (postcss, transitively via next) whose fix needs a major Next.js
      # version bump, not something to force as a side effect of adding
      # scanning. Dependabot (.github/dependabot.yml) surfaces that one
      # as a reviewable PR instead. This step exists to catch a NEW
      # critical vulnerability the moment a dependency change introduces
      # one — it passes clean today (0 critical) and stays a real gate.
      - name: Dependency audit (critical only)
        run: npm audit --audit-level=critical

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + rendering + integration tests
        run: npm test

      - name: Build
        run: npm run build
