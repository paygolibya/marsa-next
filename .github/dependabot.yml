version: 2
updates:
  # npm dependencies — weekly, grouped into fewer PRs so this doesn't spam
  # the repo with one PR per patch bump. Existing known issues (postcss/
  # next, high severity — needs a major Next.js version bump, deliberately
  # not forced by this session's audit-CI change) will show up here as a
  # real, reviewable PR instead of being silently ignored or forced through.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The CI/load-test workflow actions themselves (actions/checkout,
  # actions/setup-node) — same reasoning, kept current automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
